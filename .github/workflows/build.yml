# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'oracle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
      - name: Build with Gradle Wrapper
        run: chmod +x gradlew && ./gradlew jpackageImage
      - name: Create tarball
        run: tar -cvf PuzzleSolver-linux.tar.gz build/jpackage/PuzzleSolver
      - name: Upload tar
        uses: actions/upload-artifact@v7
        with:
          path: PuzzleSolver-linux.tar.gz
          archive: false
      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          path: build/jpackage/PuzzleSolver
          name: PuzzleSolver-linux.zip

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'oracle'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
      - name: Build with Gradle Wrapper
        run: ./gradlew jpackageImage
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: build/jpackage/PuzzleSolver
          name: PuzzleSolver-windows.zip